name: Build ATM chapter pages

on:
  push:
    branches: [atm-deploy]
    paths:
      - '.github/workflows/build-atm-pages.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source PDF
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://drive.usercontent.google.com/download?id=1NaPUtXmQOLDUcIP9uzpgym9drk15mkRv&export=download&confirm=t'
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o /tmp/capitulo_01.pdf
          test "$(stat -c%s /tmp/capitulo_01.pdf)" -gt 1000000
          file /tmp/capitulo_01.pdf

      - name: Render and optimize 64 pages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          rm -rf atm-pages
          mkdir -p atm-pages /tmp/atm-render
          pdftoppm -jpeg -scale-to-x 1100 -scale-to-y -1 -jpegopt quality=76,progressive=y,optimize=y /tmp/capitulo_01.pdf /tmp/atm-render/page
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/atm-render')
          dst=Path('atm-pages')
          files=sorted(src.glob('page-*.jpg'))
          if len(files) != 64:
              raise SystemExit(f'Expected 64 pages, got {len(files)}')
          for i,p in enumerate(files,1):
              (dst/f'page-{i:03}.jpg').write_bytes(p.read_bytes())
          PY

      - name: Commit generated pages
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atm-pages
          if git diff --cached --quiet; then
            echo 'No page changes.'
            exit 0
          fi
          git commit -m 'Generate ATM chapter 1 pages [skip ci]'
          git push
